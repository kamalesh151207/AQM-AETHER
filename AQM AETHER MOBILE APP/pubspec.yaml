name: aqm_aether
description: AQM AETHER — Environmental Intelligence & Sensor Monitoring Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # BLE
  flutter_blue_plus: ^1.35.3

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Charts
  fl_chart: ^0.69.0

  # CSV Export
  csv: ^6.0.0
  path_provider: ^2.1.4
  share_plus: ^10.0.3

  # Permissions
  permission_handler: ^11.3.1

  # Notifications & Audio Alarm
  flutter_local_notifications: ^17.2.3
  audioplayers: ^6.1.0

  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  shared_preferences_android: 2.3.4
  path_provider_android: 2.2.15

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/

